name: commit-heatmap

# 毎日データを作り直して gh-pages ブランチへ公開する。
# schedule は既定ブランチにあるワークフローしか動かないため、このファイルは main に置くこと。

on:
  schedule:
    # 20:00 UTC = 05:00 JST
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/commit-heatmap/**"
      - ".github/workflows/commit-heatmap.yml"

concurrency:
  group: commit-heatmap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the branch we aggregate
        run: git fetch --no-tags origin +refs/heads/draft:refs/remotes/origin/draft

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build data
        run: node .github/commit-heatmap/build-data.mjs --ref origin/draft --out dist/commits.json

      # gh-pages を取り出し、データを差し替える。サイトのファイルはソースが変わったときだけ差分になる。
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUBLIC="$RUNNER_TEMP/gh-pages"

          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone -q --single-branch --branch gh-pages "$REMOTE" "$PUBLIC"
          else
            git init -q -b gh-pages "$PUBLIC"
            git -C "$PUBLIC" remote add origin "$REMOTE"
          fi

          cp -R .github/commit-heatmap/site/. "$PUBLIC/"
          cp dist/commits.json "$PUBLIC/commits.json"
          touch "$PUBLIC/.nojekyll"
          # Vercel の preview デプロイを止める。この設定は対象ブランチ側の
          # vercel.json を読むため、main ではなく gh-pages に置く必要がある。
          cp .github/commit-heatmap/gh-pages-vercel.json "$PUBLIC/vercel.json"

          # Pages はアセットに max-age=600 を付けるため、参照にバージョンを埋める。
          # サイトのソースが変わったときだけ値が動くので、日次実行では差分にならない。
          VERSION=$(git log -1 --format=%h -- .github/commit-heatmap/site)
          sed -i "s/{{VERSION}}/${VERSION}/g" "$PUBLIC/index.html"

          cd "$PUBLIC"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "変更なし。コミットしません。"
            exit 0
          fi

          CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
          if [ "$(git diff --cached --name-only)" = "commits.json" ]; then
            MSG="データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          else
            MSG="サイト更新: ${CHANGED% }"
          fi

          git commit -q -m "$MSG"
          git push -q origin gh-pages
          echo "$MSG"
          echo "更新したファイル: ${CHANGED% }"
