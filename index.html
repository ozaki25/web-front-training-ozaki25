<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>コミットの日付 × 時間ヒートマップ</title>
    <meta name="description" content="コミット数を日付 × 時間帯で表示。毎日更新。" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f1f3f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=ce992fa" />
    <script>
      try {
        const t = localStorage.getItem("heatmap-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%232a78d6'/><rect x='3' y='3' width='4' height='4' rx='1' fill='%23cde2fb'/><rect x='9' y='3' width='4' height='4' rx='1' fill='%23fff'/><rect x='3' y='9' width='4' height='4' rx='1' fill='%23fff'/><rect x='9' y='9' width='4' height='4' rx='1' fill='%23184f95'/></svg>"
    />
  </head>
  <body>
    <div class="wrap">
      <h1 class="title">コミットの日付 × 時間ヒートマップ</h1>

      <section class="card">
        <div class="bar-row">
          <div class="cap">
            <h2 id="grid-sub">&nbsp;</h2>
          </div>
          <div class="controls">
            <div class="seg" role="group" aria-label="表示する期間">
              <button type="button" class="segbtn" data-range="30">直近 30 日</button>
              <button type="button" class="segbtn" data-range="90">直近 90 日</button>
              <button type="button" class="segbtn" data-range="0">全期間</button>
            </div>
            <button type="button" class="btn" id="numbtn" aria-pressed="false">数値を表示</button>
            <button type="button" class="btn" id="tablebtn" aria-pressed="false">表で見る</button>
            <button type="button" class="btn icon" id="themebtn"></button>
          </div>
        </div>

        <div class="pane" id="chartview">
          <div class="grid" id="grid" role="img" aria-label="読み込み中"></div>
        </div>

        <div class="tablewrap" id="tableview" hidden></div>

        <div class="legend" id="legend" aria-hidden="true"></div>
      </section>

      <p class="updated" id="updated"></p>
    </div>

    <div class="tip" id="tip" role="status" aria-live="off"></div>

    <noscript>
      <p style="padding: 24px">表示には JavaScript が必要です。</p>
    </noscript>

    <script src="./app.js?v=ce992fa"></script>
  </body>
</html>
